# O banco, sozinho.
#
#   docker compose -f docker/postgres.yml up -d
#   docker compose -f docker/postgres.yml down        # o volume FICA
#
# Compose próprio, volume próprio, ciclo de vida próprio — de propósito. O banco
# sobrevive a rebuild da aplicação, e derrubar a aplicação não pode derrubar
# dado. É a mesma razão de o MinIO ter o dele.
#
# **Já tem um `entendo-postgres` feito à mão?** Remova-o uma vez
# (`docker rm -f entendo-postgres`) antes do primeiro `up`: o banco NÃO se
# perde, porque o volume abaixo é fixado no mesmo nome que ele já usa.
#
# As migrations continuam sendo aplicadas à mão (`pnpm db:migrate`) — subir o
# container não migra nada.

# **Os limites são de um servidor real: 4 vCPU, 16 GB.** Eles não estão aqui
# para economizar, e sim para que nenhum processo consiga derrubar os outros —
# num servidor pequeno o que mata é um container sozinho comendo a máquina, não
# a soma dos quatro. Os tetos de CPU somam mais que 4 de propósito: são teto, não
# reserva, e os picos não acontecem juntos. Os de MEMÓRIA somam menos que 16, que
# é o número que precisa fechar.

name: entendo-postgres

services:
  postgres:
    image: postgres:16
    container_name: entendo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-entendo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-entendo}']
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G

volumes:
  # Nome FIXO, e não o `entendo-postgres_dados` que o compose geraria: é o
  # volume que o container feito à mão já usa, então adotar o compose não
  # recomeça o banco.
  dados:
    name: entendo-postgres-data
